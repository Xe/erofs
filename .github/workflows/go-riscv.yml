name: Go (RISCV)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  go_build_riscv:
    strategy:
      matrix:
        go_version:
          - oldstable
          - stable
        os:
          - ubuntu-24.04-riscv
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: stable

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...
